name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

# Отменять предыдущие запуски на той же ветке
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты и сборка (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    env:
      DATABASE_URL: "file:./ci.db"
      JWT_ACCESS_SECRET: "ci-access-secret-0123456789abcdef0123456789abcdef"
      JWT_REFRESH_SECRET: "ci-refresh-secret-0123456789abcdef0123456789abcdef"
      ADMIN_HASH_ROUTE: "ci-admin-gateway"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Prisma db push (SQLite smoke)
        run: npx prisma db push --skip-generate

      - name: Build
        run: npm run build

  docker:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cryteam-secweb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
